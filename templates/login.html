{% extends "base.html" %}

{% block title %}Login - FoodHub{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back!</h2>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%; padding: 1rem;">Login</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: #e23744; font-weight: bold;">Register here</a>
    </p>
</div>
{% endblock %}
{% block footer %}{% endblock %}
