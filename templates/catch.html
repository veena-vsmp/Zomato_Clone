<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Coins</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    background:
      linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)),
      url("./images/catch-bg.jpg") no-repeat center center fixed;
    background-size: cover;
    color: white;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  h2 {
    margin-top: 20px;
    color: #ffd700;
    text-shadow: 0 0 10px #ffd700, 0 0 20px #ffb400;
  }

  p {
    color: #ccc;
  }

  #gameArea {
    width: 320px;
    height: 420px;
    background: rgba(0, 0, 0, 0.6);
    border: 3px solid #ffd700;
    border-radius: 12px;
    margin: 30px auto;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
  }

  #basket {
    width: 60px;
    height: 20px;
    background: radial-gradient(circle at 30% 30%, #ffd700, #ffb400);
    position: absolute;
    bottom: 10px;
    left: 130px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
  }

  .coin {
    width: 20px;
    height: 20px;
    background: radial-gradient(circle at 30% 30%, #ffd700, #ffb400);
    border-radius: 50%;
    position: absolute;
    top: 0;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  #score {
    margin-top: 10px;
    color: #ffd700;
    font-weight: bold;
    font-size: 1.2rem;
    text-shadow: 0 0 8px #ffd700;
  }

  /* Ambient glowing gold lines */
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      45deg,
      rgba(255, 215, 0, 0.05),
      rgba(255, 215, 0, 0.05) 2px,
      transparent 2px,
      transparent 6px
    );
    animation: moveGlow 20s linear infinite;
    pointer-events: none;
  }

  @keyframes moveGlow {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100px, -100px); }
  }
  
  </style>
</head>
<body>
  <h2>Catch the Coins 🪙</h2>
  <p>Use ← → arrows to move the basket!</p>
  <div id="gameArea"><div id="basket"></div></div>
  <p id="score">Score: 0</p>
  <script>
    const basket = document.getElementById("basket");
    const gameArea = document.getElementById("gameArea");
    const scoreDisplay = document.getElementById("score");
    let basketX = 120, score = 0, gameInterval;
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && basketX > 0) basketX -= 20;
      if (e.key === "ArrowRight" && basketX < 240) basketX += 20;
      basket.style.left = basketX + "px";
    });
    startGame();
    function startGame() {
      gameInterval = setInterval(() => {
        const coin = document.createElement("div");
        coin.classList.add("coin");
        coin.style.left = Math.random() * 280 + "px";
        gameArea.appendChild(coin);
        let coinTop = 0;
        const fall = setInterval(() => {
          coinTop += 5; coin.style.top = coinTop + "px";
          if (coinTop > 360) {
            if (parseInt(coin.style.left) > basketX - 20 && parseInt(coin.style.left) < basketX + 60) {
              score++; scoreDisplay.textContent = "Score: " + score; coin.remove(); clearInterval(fall);
            } else if (coinTop > 380) { coin.remove(); clearInterval(fall); }
          }
        }, 50);
      }, 800);
      setTimeout(() => {
        clearInterval(gameInterval);
        alert("Game Over! You caught " + score + " coins!");
        var coin_balance = coin_balance + score;
        let total = parseInt(localStorage.getItem("supercoins") || 0);
        total += score;
        localStorage.setItem("supercoins", total);
        window.close();
      }, 15000);
    }
  </script>
</body>
</html>
