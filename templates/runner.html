<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delivery Runner</title>
  <style>
    :root{--bg:#000;--fg:#fff;--gold1:#FFD700;--gold2:#FFA500}
    html,body{
      height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial;
      display:flex;align-items:center;justify-content:center;
    }
    #wrap{position:relative}
    canvas{
      background:linear-gradient(#050505,#000);
      display:block;border-radius:6px;
    }
    #coinsUI{
      position:absolute;right:12px;top:8px;
      color:var(--fg);font-weight:700;
      background:rgba(255,255,255,0.05);
      padding:6px 10px;border-radius:6px;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="gameCanvas" width="900" height="300"></canvas>
    <div id="coinsUI">Coins: <span id="coins">0</span></div>
  </div>

  <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const coinsEl = document.getElementById('coins');

  // ✔ Game settings
  let gameSpeed = 4.2;
  let coins_earned = 0;
  let isGameOver = false;
  let frame = 0;

  const runner = { x:100, y:220, w:40, h:60, vy:0, jumpPower:-12, gravity:0.7, onGround:true };
  let obstacles = [];
  let coins = [];

  function rand(min,max){ return Math.random()*(max-min)+min; }

  // ✔ Reset game
  function resetGame(){
    runner.y = 220; runner.vy = 0; runner.onGround = true;
    obstacles = []; coins = []; isGameOver=false; frame=0;
    coins_earned = 0; coinsEl.textContent = coins_earned;
    requestAnimationFrame(loop);
  }

  // ✔ Spawn obstacles
  function spawnObstacle(){
    const t = Math.floor(rand(0,4));
    if(t===0) obstacles.push({x:canvas.width,y:240,w:28,h:40,color:'#555',shape:'rect'});
    else if(t===1) obstacles.push({x:canvas.width,y:250,w:50,h:30,color:'#777',shape:'barrier'});
    else if(t===2) obstacles.push({x:canvas.width,y:230,w:35,h:35,color:'#999',shape:'cube'});
    else obstacles.push({x:canvas.width,y:245,w:20,h:35,color:'#aaa',shape:'cone'});
  }

  // ✔ Spawn coins
  function spawnCoin(){
    coins.push({x:canvas.width, y:160 + Math.random()*80, r:9});
  }

  // ✔ Controls
  window.addEventListener('keydown', e=>{
    if((e.code==='Space' || e.code==='ArrowUp') && runner.onGround && !isGameOver){
      runner.vy = runner.jumpPower;
      runner.onGround=false;
    }
  });

  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(runner.onGround && !isGameOver){
      runner.vy = runner.jumpPower;
      runner.onGround=false;
    }
  });

  // ✔ Rectangle collision (for obstacles)
  function rectCollision(a,b){
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ✔ NEW FIX — Perfect circle-rectangle collision for coins
  function circleRectCollision(circle, rect){
    const distX = Math.abs(circle.x - (rect.x + rect.w/2));
    const distY = Math.abs(circle.y - (rect.y + rect.h/2));

    if (distX > (rect.w/2 + circle.r)) return false;
    if (distY > (rect.h/2 + circle.r)) return false;

    if (distX <= rect.w/2) return true;
    if (distY <= rect.h/2) return true;

    const dx = distX - rect.w/2;
    const dy = distY - rect.h/2;

    return (dx*dx + dy*dy) <= (circle.r * circle.r);
  }

  // ✔ Main game loop
  function loop(){
    if(isGameOver) return;
    frame++;

    // background
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // stars
    ctx.fillStyle='#222';
    for(let i=0;i<40;i++){
      ctx.fillRect((i*37)%canvas.width,(i*13)%120,1,1);
    }

    // ground
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,280);
    ctx.lineTo(canvas.width,280);
    ctx.stroke();

    // runner
    ctx.fillStyle='#e33';
    ctx.fillRect(runner.x, runner.y, runner.w, runner.h-10);
    ctx.fillStyle='#fff';
    ctx.fillRect(runner.x+10, runner.y-12, 20,12);
    ctx.fillStyle='#e33';
    ctx.fillRect(runner.x+8, runner.y-18, 24,6);
    ctx.fillStyle='#444';
    ctx.fillRect(runner.x-16, runner.y+8, 14,20);

    // ✔ Obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.x -= gameSpeed;

      ctx.fillStyle = o.color;
      if(o.shape==='rect') ctx.fillRect(o.x,o.y,o.w,o.h);
      else if(o.shape==='barrier'){
        ctx.beginPath();
        ctx.moveTo(o.x,o.y+o.h);
        ctx.lineTo(o.x+o.w,o.y+o.h);
        ctx.lineTo(o.x+o.w/2,o.y);
        ctx.closePath();
        ctx.fill();
      }
      else if(o.shape==='cube'){
        ctx.fillRect(o.x,o.y,o.w,o.h);
      }
      else if(o.shape==='cone'){
        ctx.beginPath();
        ctx.moveTo(o.x,o.y+o.h);
        ctx.lineTo(o.x+o.w/2,o.y);
        ctx.lineTo(o.x+o.w,o.y+o.h);
        ctx.closePath();
        ctx.fill();
      }

      if(o.x + o.w < -10) obstacles.splice(i,1);

      if(rectCollision(runner,o)){
        isGameOver = true;
        updateCoinsToWallet(coins_earned);
        drawGameOver();
        return;
      }
    }

    // ✔ FIXED COIN SYSTEM
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];

      // collision FIRST (fixes glitch)
      if (circleRectCollision(c, runner)) {
        coins.splice(i, 1);
        coins_earned++;
        coinsEl.textContent = coins_earned;
        continue;
      }

      // move
      c.x -= gameSpeed;

      // draw
      const grad = ctx.createLinearGradient(c.x-c.r,c.y-c.r,c.x+c.r,c.y+c.r);
      grad.addColorStop(0,'#FFD700');
      grad.addColorStop(1,'#FFA500');

      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.fill();

      ctx.strokeStyle='#b8860b';
      ctx.stroke();

      // remove if off-screen
      if(c.x + c.r < 0) coins.splice(i,1);
    }

    // ✔ physics
    runner.y += runner.vy;
    runner.vy += runner.gravity;
    if(runner.y > 220){
      runner.y = 220;
      runner.vy = 0;
      runner.onGround = true;
    }

    // ✔ spawning
    if(frame % 180 === 0) spawnObstacle();
    if(frame % 210 === 0) spawnCoin();

    requestAnimationFrame(loop);
  }

  // ✔ Game Over screen
  function drawGameOver(){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    ctx.font='bold 28px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
    ctx.font='16px sans-serif';
    ctx.fillText('Click OK to restart after reward alert', canvas.width/2, canvas.height/2 + 20);
  }

  // ✔ API Sync
  function updateCoinsToWallet(score){
    fetch('/api/game/complete', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ game_type:'memory', score: score })
    })
    .then(r=>r.json())
    .then(data=>{
      if(data.success){
        alert(`🎉 You earned ${data.coins_earned} coins!\nBalance: 🪙 ${data.new_balance}`);
      } else {
        alert(data.message || 'Could not update coins.');
      }
      setTimeout(()=>{ resetGame(); },1000);
    })
    .catch(err=>{
      console.error('Error updating coins:', err);
      setTimeout(()=>{ resetGame(); },1000);
    });
  }

  requestAnimationFrame(loop);
  </script>
</body>
</html>
