{% extends "base.html" %}

{% block title %}Edit Vendor - Zomato{% endblock %}

{% block content %}
<h2>Edit Vendor</h2>

<form method="POST">
    <label>Name:</label>
    <input type="text" name="name" value="{{ vendor.name }}" required><br>

    <label>Cuisine:</label>
    <input type="text" name="cuisine" value="{{ vendor.cuisine }}" required><br>

    <label>Location:</label>
    <input type="text" name="location" value="{{ vendor.location }}" required><br>

    <button type="submit">Update</button>
</form>
{% endblock %}
