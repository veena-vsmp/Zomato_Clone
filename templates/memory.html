<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Flip Game 🧠</title>
  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
  }

  body {
    background:
      linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)),
      url("./images/gold-glow-bg.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  h1 {
    color: #ffd700;
    text-shadow: 0 0 10px #ffd700, 0 0 25px #ffb400;
    margin-bottom: 15px;
    font-size: 2rem;
  }

  .game-container {
    width: 500px;
    display: grid;
    grid-template-columns: repeat(4, 110px);
    grid-gap: 18px;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    padding: 25px;
    border-radius: 20px;
    border: 2px solid #ffd700;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
  }

  .card {
    width: 110px;
    height: 110px;
    perspective: 1000px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flip .card-inner {
    transform: rotateY(180deg);
  }

  /* FRONT SIDE — golden shimmering look */
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
  }

  .card-front {
    background: linear-gradient(145deg, #222, #444);
    border: 2px solid #ffd700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem; /* larger “?” mark */
    color: #ffd700;
    box-shadow: inset 0 0 10px #ffd700, 0 0 20px rgba(255, 215, 0, 0.4);
    text-shadow: 0 0 10px #ffd700;
  }

  /* BACK SIDE — emoji face */
  .card-back {
    background: radial-gradient(circle at 30% 30%, #ffd700, #ffb400);
    transform: rotateY(180deg);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem; /* ✅ enlarged emoji size */
  }

  #message {
    margin-top: 20px;
    font-size: 1.3rem;
    color: #ffd700;
    text-shadow: 0 0 10px #ffb400, 0 0 20px #ffd700;
  }

  button {
    margin-top: 20px;
    padding: 12px 25px;
    font-weight: bold;
    background: #ffd700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #000;
    font-size: 1rem;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    transition: all 0.2s ease;
  }

  button:hover {
    background: #ffea00;
    box-shadow: 0 0 25px rgba(255, 215, 0, 1);
  }

  /* Sparkle animation (unchanged) */
  @keyframes spark {
    0% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 0.6; }
  }

  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: radial-gradient(circle, #ffd700, #ffb400);
    border-radius: 50%;
    animation: spark 2s ease-in-out infinite;
    opacity: 0.7;
  }

  .sparkle:nth-child(1) { top: 15%; left: 25%; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 35%; left: 70%; animation-delay: 1s; }
  .sparkle:nth-child(3) { top: 60%; left: 45%; animation-delay: 2s; }
  .sparkle:nth-child(4) { top: 80%; left: 15%; animation-delay: 3s; }
  .sparkle:nth-child(5) { top: 50%; left: 85%; animation-delay: 1.5s; }
   
  </style>
</head>
<body>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <h1>🧠 Memory Flip Game</h1>
  <div class="game-container" id="gameContainer"></div>
  <div id="message"></div>
  <button onclick="restartGame()">Restart Game</button>

  <script>
    const emojis = ["🪙", "⭐", "💎", "🔥", "🎮", "🎲", "🧩", "💰"];
    let cards = [...emojis, ...emojis]; // duplicate for pairs
    let flippedCards = [];
    let matchedCards = 0;

    function shuffle(array) {
      array.sort(() => Math.random() - 0.5);
    }

    function createCards() {
      const container = document.getElementById("gameContainer");
      container.innerHTML = "";
      shuffle(cards);
      cards.forEach((emoji) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">?</div>
            <div class="card-back">${emoji}</div>
          </div>
        `;
        card.addEventListener("click", () => flipCard(card, emoji));
        container.appendChild(card);
      });
    }

    function flipCard(card, emoji) {
      if (flippedCards.length < 2 && !card.classList.contains("flip")) {
        card.classList.add("flip");
        flippedCards.push({ card, emoji });
      }

      if (flippedCards.length === 2) {
        if (flippedCards[0].emoji === flippedCards[1].emoji) {
          flippedCards[0].card.style.pointerEvents = "none";
          flippedCards[1].card.style.pointerEvents = "none";
          flippedCards = [];
          matchedCards += 2;
          if (matchedCards === cards.length) {
            document.getElementById("message").innerText =
              "🎉 You matched all cards! You win 50 SuperCoins 🪙";
              updateCoinsToWallet(10);
          }
        } else {
          setTimeout(() => {
            flippedCards[0].card.classList.remove("flip");
            flippedCards[1].card.classList.remove("flip");
            flippedCards = [];
          }, 800);
        }
      }
    }

    function restartGame() {
      matchedCards = 0;
      flippedCards = [];
      createCards();
      document.getElementById("message").innerText = "";
    }

    createCards();


    function updateCoinsToWallet(score) {
  // Send a POST request to Flask backend
  fetch('/api/game/complete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      game_type: 'memory', // identifies which game
      score: score         // your score (here: 10 coins for finishing)
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert(`🎉 You earned ${data.coins_earned} coins!\n Your new balance: 🪙 ${data.new_balance}`);
      // redirect to Play page to see updated balance
      window.location.href = "/games";
    } else {
      alert(data.message || "Could not update coins. Try again!");
    }
  })
  .catch(err => console.error("Error updating coins:", err));
}

  </script>
</body>
</html>
