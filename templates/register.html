{% extends "base.html" %}

{% block title %}Register - FoodHub{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Create Your Account</h2>
    <p style="text-align: center; color: #636e72; margin-bottom: 1.5rem;">Get 100 welcome coins upon registration!</p>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn" style="width: 100%; padding: 1rem;">Register</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #e23744; font-weight: bold;">Login here</a>
    </p>
</div>
{% endblock %}
{% block footer %} {% endblock %}
